<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- プライバシー: 外部への通信を一切許可しない（画像はブラウザ内でのみ処理） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; form-action 'none'; base-uri 'none'">
<title>2分割壁紙メーカー</title>
<style>
:root{
  --bg:#f4f4f6; --panel:#ffffff; --text:#1c1c22; --muted:#6b6b76; --line:#dcdce2;
  --accent:#2f6fec; --accent-text:#fff; --warn:#b4560a; --stage:#e6e6ea;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121216; --panel:#1c1c22; --text:#ececf1; --muted:#9a9aa6; --line:#2e2e37;
    --accent:#5b8ef5; --accent-text:#fff; --warn:#f0a050; --stage:#0b0b0e;
  }
}
:root[data-theme="dark"]{
  --bg:#121216; --panel:#1c1c22; --text:#ececf1; --muted:#9a9aa6; --line:#2e2e37;
  --accent:#5b8ef5; --accent-text:#fff; --warn:#f0a050; --stage:#0b0b0e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
header h1{font-size:17px;margin:0}
header .priv{color:var(--muted);font-size:12px}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px;max-width:1200px;margin:0 auto}
@media (max-width:820px){ main{grid-template-columns:minmax(0,1fr)} }
.stage{background:var(--stage);border-radius:12px;display:flex;justify-content:center;align-items:flex-start;padding:12px;min-width:0}
canvas#view{touch-action:none;display:block;border-radius:6px;cursor:grab;box-shadow:0 2px 14px rgba(0,0,0,.25)}
canvas#view:active{cursor:grabbing}
aside{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h2{font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row label{color:var(--muted);min-width:64px}
button,select,input[type=number]{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600;padding:10px 14px}
button:disabled{opacity:.45;cursor:default}
input[type=number]{width:84px}
input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
input[type=color]{width:36px;height:30px;border:1px solid var(--line);border-radius:6px;background:none;padding:2px}
.info{font-size:12px;color:var(--muted);min-height:1.5em}
.info .warn{color:var(--warn)}
.hint{font-size:12px;color:var(--muted);margin:4px 0 0}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1>2分割壁紙メーカー</h1>
  <span class="priv">画像はこの端末のブラウザ内だけで処理されます（通信なし・保存なし）</span>
</header>
<main>
  <div class="stage" id="stage"><canvas id="view"></canvas></div>
  <aside>
    <div class="card">
      <h2>出力サイズ</h2>
      <div class="row">
        <select id="preset">
          <option value="1080x2400" selected>Pixel 8（1080×2400）</option>
          <option value="1344x2992">Pixel 8 Pro（1344×2992）</option>
          <option value="custom">カスタム</option>
        </select>
      </div>
      <div class="row" id="customRow">
        <input type="number" id="outW" min="100" max="8000" value="1080"> ×
        <input type="number" id="outH" min="100" max="8000" value="2400"> px
      </div>
      <div class="row">
        <label>区切り線</label>
        <input type="number" id="gap" min="0" max="200" value="0"> px
        <input type="color" id="gapColor" value="#000000" title="区切り線の色">
      </div>
      <div class="row">
        <label>背景色</label>
        <input type="color" id="bgColor" value="#000000" title="画像が無い部分の色">
        <button id="swap">上下を入れ替え</button>
      </div>
    </div>

    <div class="card slot-card" data-slot="0">
      <h2>上の画像 <button class="pick">画像を選択</button></h2>
      <div class="row"><label>拡大</label><input type="range" class="zoom" min="-200" max="400" value="0" step="1"></div>
      <div class="row">
        <button class="fill">画面いっぱい</button>
        <button class="fit">全体表示</button>
        <button class="rot">90°回転</button>
        <button class="flip">左右反転</button>
        <button class="clear">削除</button>
      </div>
      <div class="info"></div>
    </div>

    <div class="card slot-card" data-slot="1">
      <h2>下の画像 <button class="pick">画像を選択</button></h2>
      <div class="row"><label>拡大</label><input type="range" class="zoom" min="-200" max="400" value="0" step="1"></div>
      <div class="row">
        <button class="fill">画面いっぱい</button>
        <button class="fit">全体表示</button>
        <button class="rot">90°回転</button>
        <button class="flip">左右反転</button>
        <button class="clear">削除</button>
      </div>
      <div class="info"></div>
    </div>

    <div class="card">
      <h2>保存</h2>
      <div class="row">
        <label>形式</label>
        <select id="format">
          <option value="image/png" selected>PNG（劣化なし・推奨）</option>
          <option value="image/jpeg">JPEG</option>
          <option value="image/webp">WebP</option>
        </select>
      </div>
      <div class="row hidden" id="qualityRow">
        <label>品質</label>
        <input type="range" id="quality" min="70" max="100" value="98">
        <span id="qualityVal">98</span>
      </div>
      <div class="row">
        <button class="primary" id="save">壁紙を保存</button>
        <button id="share" class="hidden">共有…</button>
      </div>
      <p class="hint">操作: ドラッグで移動／ホイール・ピンチで拡大縮小／ダブルクリックで画面いっぱいに戻す。空の枠はタップで画像選択、ファイルのドロップも可。</p>
    </div>
  </aside>
</main>
<input type="file" id="file" accept="image/*" class="hidden">

<script>
'use strict';
const $ = s => document.querySelector(s);
const view = $('#view'), vctx = view.getContext('2d');
const stage = $('#stage');

let W = 1080, H = 2400, gap = 0, gapColor = '#000000', bgColor = '#000000';
// cx, cy: 枠の中心から見た画像中心のずれ（出力px）／scale: 出力px ÷ 元画像px
const newSlot = () => ({ img: null, name: '', cx: 0, cy: 0, scale: 1, rot: 0, flip: false });
const slots = [newSlot(), newSlot()];
let k = 1; // プレビュー倍率（プレビューcanvas px ÷ 出力px）

function slotRect(i) {
  const h0 = Math.floor((H - gap) / 2);
  return i === 0 ? { x: 0, y: 0, w: W, h: h0 } : { x: 0, y: h0 + gap, w: W, h: H - h0 - gap };
}
function dims(s) {
  const iw = s.img.naturalWidth || s.img.width, ih = s.img.naturalHeight || s.img.height;
  return s.rot % 180 ? [ih, iw] : [iw, ih];
}
function coverScale(i) { const r = slotRect(i), [w, h] = dims(slots[i]); return Math.max(r.w / w, r.h / h); }
function containScale(i) { const r = slotRect(i), [w, h] = dims(slots[i]); return Math.min(r.w / w, r.h / h); }

function draw(ctx, scale, preview) {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, W, H);
  slots.forEach((s, i) => {
    const r = slotRect(i);
    ctx.save();
    ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
    if (s.img) {
      const iw = s.img.naturalWidth || s.img.width, ih = s.img.naturalHeight || s.img.height;
      ctx.translate(r.x + r.w / 2 + s.cx, r.y + r.h / 2 + s.cy);
      ctx.rotate(s.rot * Math.PI / 180);
      ctx.scale(s.flip ? -s.scale : s.scale, s.scale);
      ctx.drawImage(s.img, -iw / 2, -ih / 2);
    } else if (preview) {
      ctx.strokeStyle = 'rgba(255,255,255,.35)';
      ctx.lineWidth = 6; ctx.setLineDash([24, 18]);
      ctx.strokeRect(r.x + 30, r.y + 30, r.w - 60, r.h - 60);
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.font = `${Math.round(W / 18)}px system-ui, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(i === 0 ? '上の画像' : '下の画像', r.x + r.w / 2, r.y + r.h / 2 - W / 22);
      ctx.font = `${Math.round(W / 28)}px system-ui, sans-serif`;
      ctx.fillText('タップ / ドロップで選択', r.x + r.w / 2, r.y + r.h / 2 + W / 22);
    }
    ctx.restore();
  });
  if (gap > 0) {
    ctx.fillStyle = gapColor;
    const r0 = slotRect(0);
    ctx.fillRect(0, r0.h, W, gap);
  }
}

function render() { draw(vctx, k, true); }

function layout() {
  const dpr = window.devicePixelRatio || 1;
  const availW = stage.clientWidth - 24;
  const narrow = window.matchMedia('(max-width:820px)').matches;
  const availH = window.innerHeight * (narrow ? 0.72 : 0.86);
  const dispH = Math.max(200, Math.min(availH, availW * H / W));
  const dispW = dispH * W / H;
  view.style.width = dispW + 'px';
  view.style.height = dispH + 'px';
  view.width = Math.round(dispW * dpr);
  view.height = Math.round(dispH * dpr);
  k = view.width / W;
  render();
}
new ResizeObserver(layout).observe(stage);
window.addEventListener('resize', layout);

// ---------- 画像操作 ----------
function clampScale(i, sc) { const c = coverScale(i); return Math.min(c * 16, Math.max(c * 0.25, sc)); }
function zoomAt(i, px, py, f) {
  const s = slots[i], r = slotRect(i);
  const ns = clampScale(i, s.scale * f);
  f = ns / s.scale;
  const ox = px - (r.x + r.w / 2), oy = py - (r.y + r.h / 2);
  s.cx = ox - (ox - s.cx) * f;
  s.cy = oy - (oy - s.cy) * f;
  s.scale = ns;
}
function fill(i) { const s = slots[i]; if (!s.img) return; s.scale = coverScale(i); s.cx = 0; s.cy = 0; }
function fit(i) { const s = slots[i]; if (!s.img) return; s.scale = containScale(i); s.cx = 0; s.cy = 0; }

function updateUI() {
  document.querySelectorAll('.slot-card').forEach(card => {
    const i = +card.dataset.slot, s = slots[i];
    const has = !!s.img;
    card.querySelectorAll('.zoom,.fill,.fit,.rot,.flip,.clear').forEach(el => el.disabled = !has);
    const info = card.querySelector('.info');
    if (!has) { info.textContent = '未選択'; return; }
    card.querySelector('.zoom').value = Math.round(Math.log2(s.scale / coverScale(i)) * 100);
    const iw = s.img.naturalWidth || s.img.width, ih = s.img.naturalHeight || s.img.height;
    const pct = (s.scale * 100).toFixed(s.scale < 0.1 ? 1 : 0);
    info.innerHTML = '';
    info.append(`${s.name}（${iw}×${ih}）・原寸比 ${pct}%`);
    if (s.scale > 1.001) {
      const w = document.createElement('div');
      w.className = 'warn';
      w.textContent = '⚠ 元画像より引き伸ばしています（ぼやける可能性）';
      info.append(w);
    }
  });
  $('#swap').disabled = !slots[0].img && !slots[1].img;
  $('#save').disabled = !slots[0].img && !slots[1].img;
  $('#share').disabled = $('#save').disabled;
}
function refresh() { render(); updateUI(); }

async function decode(file) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (_) {}
  }
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    return img;
  } finally { setTimeout(() => URL.revokeObjectURL(url), 0); }
}
async function loadFile(i, file) {
  if (!file) return;
  let img;
  try { img = await decode(file); }
  catch (e) { alert('この画像は読み込めませんでした（HEICなど非対応形式の可能性）。JPEG/PNG/WebP をお試しください。'); return; }
  const s = slots[i];
  if (s.img && s.img.close) s.img.close();
  Object.assign(s, newSlot(), { img, name: file.name });
  fill(i);
  refresh();
}

let pickTarget = 0;
const fileInput = $('#file');
function openPicker(i) { pickTarget = i; fileInput.value = ''; fileInput.click(); }
fileInput.addEventListener('change', () => loadFile(pickTarget, fileInput.files[0]));

// ---------- ポインタ操作（ドラッグ・ピンチ・ホイール） ----------
function toOut(e) {
  const b = view.getBoundingClientRect();
  return { x: (e.clientX - b.left) / b.width * W, y: (e.clientY - b.top) / b.height * H };
}
function hitSlot(y) { return y < slotRect(1).y - gap / 2 ? 0 : 1; }
const ptrs = new Map();
let active = 0, moved = 0;

view.addEventListener('pointerdown', e => {
  view.setPointerCapture(e.pointerId);
  const p = toOut(e);
  ptrs.set(e.pointerId, p);
  if (ptrs.size === 1) { active = hitSlot(p.y); moved = 0; }
});
view.addEventListener('pointermove', e => {
  const prev = ptrs.get(e.pointerId);
  if (!prev) return;
  const p = toOut(e), s = slots[active];
  moved += Math.hypot(p.x - prev.x, p.y - prev.y);
  if (s.img) {
    if (ptrs.size === 1) {
      s.cx += p.x - prev.x; s.cy += p.y - prev.y;
    } else if (ptrs.size === 2) {
      const other = [...ptrs.entries()].find(([id]) => id !== e.pointerId)[1];
      const d0 = Math.hypot(prev.x - other.x, prev.y - other.y);
      const d1 = Math.hypot(p.x - other.x, p.y - other.y);
      const m0 = { x: (prev.x + other.x) / 2, y: (prev.y + other.y) / 2 };
      const m1 = { x: (p.x + other.x) / 2, y: (p.y + other.y) / 2 };
      if (d0 > 0) zoomAt(active, m0.x, m0.y, d1 / d0);
      s.cx += m1.x - m0.x; s.cy += m1.y - m0.y;
    }
    refresh();
  }
  ptrs.set(e.pointerId, p);
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  const wasSingle = ptrs.size === 1;
  ptrs.delete(e.pointerId);
  if (wasSingle && e.type === 'pointerup' && moved < W * 0.01 && !slots[active].img) openPicker(active);
}
view.addEventListener('pointerup', endPtr);
view.addEventListener('pointercancel', endPtr);
view.addEventListener('wheel', e => {
  e.preventDefault();
  const p = toOut(e), i = hitSlot(p.y);
  if (!slots[i].img) return;
  zoomAt(i, p.x, p.y, Math.exp(-e.deltaY * 0.0015));
  refresh();
}, { passive: false });
view.addEventListener('dblclick', e => { const i = hitSlot(toOut(e).y); fill(i); refresh(); });

// ドラッグ＆ドロップ
view.addEventListener('dragover', e => e.preventDefault());
view.addEventListener('drop', e => {
  e.preventDefault();
  const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  const i = hitSlot(toOut(e).y);
  loadFile(i, files[0]);
  if (files[1]) loadFile(1 - i, files[1]);
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());

// ---------- 枠ごとのボタン ----------
document.querySelectorAll('.slot-card').forEach(card => {
  const i = +card.dataset.slot;
  card.querySelector('.pick').onclick = () => openPicker(i);
  card.querySelector('.fill').onclick = () => { fill(i); refresh(); };
  card.querySelector('.fit').onclick = () => { fit(i); refresh(); };
  card.querySelector('.rot').onclick = () => { const s = slots[i]; s.rot = (s.rot + 90) % 360; fill(i); refresh(); };
  card.querySelector('.flip').onclick = () => { const s = slots[i]; s.flip = !s.flip; s.cx = -s.cx; refresh(); };
  card.querySelector('.clear').onclick = () => {
    const s = slots[i]; if (s.img && s.img.close) s.img.close();
    slots[i] = newSlot(); refresh();
  };
  card.querySelector('.zoom').oninput = e => {
    const s = slots[i]; if (!s.img) return;
    const target = coverScale(i) * Math.pow(2, e.target.value / 100);
    const r = slotRect(i);
    zoomAt(i, r.x + r.w / 2, r.y + r.h / 2, target / s.scale);
    refresh();
  };
});

// ---------- 全体設定 ----------
function setSize(w, h) {
  const ratios = slots.map((s, i) => s.img ? s.scale / coverScale(i) : 1);
  const oldW = W;
  W = w; H = h;
  slots.forEach((s, i) => {
    if (!s.img) return;
    const f = W / oldW;
    s.scale = ratios[i] * coverScale(i); s.cx *= f; s.cy *= f;
  });
  layout(); updateUI();
}
$('#preset').onchange = e => {
  const v = e.target.value;
  $('#customRow').classList.toggle('hidden', v !== 'custom');
  if (v !== 'custom') {
    const [w, h] = v.split('x').map(Number);
    $('#outW').value = w; $('#outH').value = h;
    setSize(w, h);
  }
};
$('#customRow').classList.add('hidden');
const onCustom = () => {
  const w = Math.min(8000, Math.max(100, +$('#outW').value || 1080));
  const h = Math.min(8000, Math.max(100, +$('#outH').value || 2400));
  setSize(w, h);
};
$('#outW').onchange = onCustom; $('#outH').onchange = onCustom;
$('#gap').oninput = e => {
  gap = Math.max(0, Math.min(200, Math.round(+e.target.value || 0)));
  slots.forEach((s, i) => { if (s.img) s.scale = clampScale(i, s.scale); });
  refresh();
};
$('#gapColor').oninput = e => { gapColor = e.target.value; render(); };
$('#bgColor').oninput = e => { bgColor = e.target.value; render(); };
$('#swap').onclick = () => {
  const ratios = slots.map((s, i) => s.img ? s.scale / coverScale(i) : 1);
  [slots[0], slots[1]] = [slots[1], slots[0]];
  slots.forEach((s, i) => { if (s.img) s.scale = ratios[1 - i] * coverScale(i); });
  refresh();
};

// ---------- 保存 ----------
$('#format').onchange = e => $('#qualityRow').classList.toggle('hidden', e.target.value === 'image/png');
$('#quality').oninput = e => $('#qualityVal').textContent = e.target.value;

function exportBlob() {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  draw(c.getContext('2d'), 1, false);
  const type = $('#format').value;
  return new Promise((res, rej) =>
    c.toBlob(b => b ? res(b) : rej(new Error('書き出しに失敗しました')), type, +$('#quality').value / 100));
}
function fileName(blob) {
  const ext = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp' }[blob.type] || 'png';
  const d = new Date(), z = n => String(n).padStart(2, '0');
  return `wallpaper_${W}x${H}_${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.${ext}`;
}
$('#save').onclick = async () => {
  const blob = await exportBlob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fileName(blob);
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
};
// スマホ: 共有シート経由で「壁紙に設定」などに直接渡せる（端末内のやり取りのみ）
if (navigator.canShare && navigator.canShare({ files: [new File([''], 'x.png', { type: 'image/png' })] })) {
  $('#share').classList.remove('hidden');
  $('#share').onclick = async () => {
    const blob = await exportBlob();
    const file = new File([blob], fileName(blob), { type: blob.type });
    try { await navigator.share({ files: [file] }); } catch (_) {}
  };
}

layout(); updateUI();
</script>
</body>
</html>
